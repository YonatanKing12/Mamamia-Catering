<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale הוסר: הוא חוסם זום בפינץ' וזו הפרה של WCAG 1.4.4 -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- זהה מילה במילה ל־PAGE_META["/"] (lib/seo.ts, 01 §4 P-01) — לעדכן יחד.
         זמן תגובה נמחק מכאן: SLOTS.responseTime הוא null. אין להחזיר בלי ערך חתום. -->
    <title>קייטרינג מאמא מיה | מהמטבח של המסעדה האיטלקית בהרצליה פיתוח, רעננה ופתח תקווה</title>
    <meta
      name="description"
      content="התפריט של המסעדה, אצלכם באירוע. שלושה מטבחים פעילים בהרצליה פיתוח, רעננה ופתח תקווה."
    />
    <meta name="theme-color" content="#fbf8f3" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:site_name" content="מאמא מיה קייטרינג" />
    <meta property="og:title" content="מאמא מיה קייטרינג — מהמטבח שלנו לאירוע שלכם" />
    <meta
      property="og:description"
      content="התפריט של המסעדה, אצלכם באירוע. שלושה מטבחים פעילים בהרצליה פיתוח, רעננה ופתח תקווה."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- גופנים מהשרת שלנו (INV-10). @font-face ב-index.css §4.2.
         אין להוסיף כאן קישור לגיליון גופנים חיצוני.
         preload רק לעברית של משקלי הגוף והכותרת — הפנים שנדרשים ל-LCP. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fonts/frank-ruhl-libre-500-hebrew.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fonts/frank-ruhl-libre-700-hebrew.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fonts/assistant-400-hebrew.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fonts/assistant-600-hebrew.woff2" />

    <!--
      Font Awesome (cdnjs) הוסר — 01 §0.1, 03 §13.3.
      גיליון סגנון חיצוני חוסם־רינדור, ממקור שלישי, עבור אייקונים בלבד.
      במקומו: lucide-react (מגיע בבאנדל, מתנער מעצים לא־בשימוש) ו־SVG
      מוטבע היכן שהאייקון הוא חלק מהפקד. אין להחזיר את ה־<link>.
    -->
  </head>
  <body dir="rtl">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
