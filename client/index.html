<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale הוסר: הוא חוסם זום בפינץ' וזו הפרה של WCAG 1.4.4 -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- זהה מילה במילה ל־PAGE_META["/"] (lib/seo.ts, 01 §4 P-01) — לעדכן יחד.
         זמן תגובה נמחק מכאן: SLOTS.responseTime הוא null. אין להחזיר בלי ערך חתום. -->
    <title>קייטרינג מאמא מיה | מהמטבח של המסעדה האיטלקית בהרצליה פיתוח, רעננה ופתח תקווה</title>
    <meta
      name="description"
      content="התפריט של המסעדה, אצלכם באירוע. שלושה מטבחים פעילים בהרצליה פיתוח, רעננה ופתח תקווה."
    />
    <meta name="theme-color" content="#fbf8f3" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:site_name" content="מאמא מיה קייטרינג" />
    <meta property="og:title" content="מאמא מיה קייטרינג — מהמטבח שלנו לאירוע שלכם" />
    <meta
      property="og:description"
      content="התפריט של המסעדה, אצלכם באירוע. שלושה מטבחים פעילים בהרצליה פיתוח, רעננה ופתח תקווה."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- חוב פתוח — מפר INV-10 (01 §0.4, "no Google Fonts"): משדר IP של כל מבקר.
         נשאר עד שיהיו גופנים מוקטנים ב־client/public/fonts/ — ראו index.css §4.2:
         @font-face מקומי מול 404 מפיל את העמוד ל־fallback, ולכן מחיקה לבדה מזיקה.
         להסיר יחד עם הוספת ה־@font-face, ואז למחוק את ההצהרה ב־/privacy. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Font Awesome (cdnjs) הוסר — 01 §0.1, 03 §13.3.
      גיליון סגנון חיצוני חוסם־רינדור, ממקור שלישי, עבור אייקונים בלבד.
      במקומו: lucide-react (מגיע בבאנדל, מתנער מעצים לא־בשימוש) ו־SVG
      מוטבע היכן שהאייקון הוא חלק מהפקד. אין להחזיר את ה־<link>.
    -->
  </head>
  <body dir="rtl">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
