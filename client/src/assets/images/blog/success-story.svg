<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="storyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff7675;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#fd79a8;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#storyBg)"/>
  
  <!-- Wedding arch -->
  <path d="M 150 200 Q 300 100 450 200" stroke="#ff6b6b" stroke-width="6" fill="none"/>
  
  <!-- Couple silhouettes -->
  <circle cx="280" cy="180" r="15" fill="#333"/>
  <rect x="275" y="195" width="10" height="30" fill="#333"/>
  <circle cx="320" cy="180" r="12" fill="#333"/>
  <rect x="318" y="192" width="8" height="33" fill="#333"/>
  
  <!-- Hearts -->
  <path d="M 200 120 C 200 110, 215 110, 215 120 C 215 110, 230 110, 230 120 C 230 130, 215 140, 215 150 C 215 140, 200 130, 200 120" fill="#ff6b6b" opacity="0.7"/>
  <path d="M 370 130 C 370 125, 380 125, 380 130 C 380 125, 390 125, 390 130 C 390 135, 380 145, 380 150 C 380 145, 370 135, 370 130" fill="#ff6b6b" opacity="0.7"/>
  
  <!-- Flowers -->
  <circle cx="140" cy="190" r="8" fill="#ffe66d"/>
  <circle cx="460" cy="190" r="8" fill="#ffe66d"/>
  <circle cx="130" cy="180" r="6" fill="#a8e6cf"/>
  <circle cx="470" cy="180" r="6" fill="#a8e6cf"/>
  
  <text x="300" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#8B4513">
    החתונה של רחל ודוד
  </text>
  <text x="300" y="270" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">
    סיפור הצלחה מרגש ומלהיב
  </text>
</svg>