<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="corporate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#corporate)"/>
  <!-- Building silhouette -->
  <rect x="50" y="150" width="80" height="200" fill="#34495e" opacity="0.8"/>
  <rect x="150" y="100" width="80" height="250" fill="#34495e" opacity="0.8"/>
  <rect x="250" y="120" width="100" height="230" fill="#34495e" opacity="0.8"/>
  <rect x="370" y="140" width="80" height="210" fill="#34495e" opacity="0.8"/>
  <rect x="470" y="180" width="80" height="170" fill="#34495e" opacity="0.8"/>
  
  <!-- Windows -->
  <rect x="60" y="170" width="10" height="15" fill="#D4AF37"/>
  <rect x="80" y="170" width="10" height="15" fill="#D4AF37"/>
  <rect x="160" y="120" width="10" height="15" fill="#D4AF37"/>
  <rect x="180" y="120" width="10" height="15" fill="#D4AF37"/>
  
  <text x="300" y="60" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="white">
    אירוע עסקי מקצועי
  </text>
  <text x="300" y="380" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#D4AF37">
    קייטרינג עסקי ברמה הגבוהה ביותר
  </text>
</svg>