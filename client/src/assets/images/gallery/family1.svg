<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="family" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff7675;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:0.5" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#family)"/>
  <!-- House representation -->
  <polygon points="200,180 300,120 400,180 400,300 200,300" fill="#8B4513" opacity="0.8"/>
  <rect x="280" y="250" width="40" height="50" fill="#654321"/>
  <rect x="230" y="200" width="30" height="30" fill="#87CEEB" stroke="#654321" stroke-width="2"/>
  <rect x="340" y="200" width="30" height="30" fill="#87CEEB" stroke="#654321" stroke-width="2"/>
  
  <!-- Balloon -->
  <circle cx="450" cy="150" r="20" fill="#ff6b6b"/>
  <circle cx="480" cy="140" r="18" fill="#4ecdc4"/>
  <circle cx="500" cy="160" r="16" fill="#ffe66d"/>
  <line x1="450" y1="170" x2="450" y2="200" stroke="#666" stroke-width="1"/>
  <line x1="480" y1="158" x2="480" y2="200" stroke="#666" stroke-width="1"/>
  <line x1="500" y1="176" x2="500" y2="200" stroke="#666" stroke-width="1"/>
  
  <text x="300" y="80" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#8B4513">
    אירוע משפחתי חם
  </text>
  <text x="300" y="360" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">
    חגיגה משפחתית עם אווירה ביתית
  </text>
</svg>