<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wedding" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f8f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#wedding)"/>
  <!-- Table representation -->
  <ellipse cx="300" cy="250" rx="200" ry="80" fill="#fff" stroke="#D4AF37" stroke-width="3"/>
  <!-- Chairs around table -->
  <circle cx="150" cy="200" r="25" fill="#8B4513" opacity="0.7"/>
  <circle cx="450" cy="200" r="25" fill="#8B4513" opacity="0.7"/>
  <circle cx="150" cy="300" r="25" fill="#8B4513" opacity="0.7"/>
  <circle cx="450" cy="300" r="25" fill="#8B4513" opacity="0.7"/>
  <circle cx="300" cy="150" r="25" fill="#8B4513" opacity="0.7"/>
  <circle cx="300" cy="350" r="25" fill="#8B4513" opacity="0.7"/>
  <!-- Decorative elements -->
  <circle cx="300" cy="250" r="15" fill="#D4AF37"/>
  <text x="300" y="100" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#8B4513">
    חתונה מרהיבה
  </text>
  <text x="300" y="380" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">
    עיצוב מושלם לחתונה בסגנון יוקרתי
  </text>
</svg>