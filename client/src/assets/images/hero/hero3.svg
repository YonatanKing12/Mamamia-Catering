  <rect x="350" y="450" width="200" height="100" fill="#34495e" rx="10"/>
  <rect x="600" y="450" width="200" height="100" fill="#34495e" rx="10"/>
  <rect x="850" y="450" width="200" height="100" fill="#34495e" rx="10"/>
