  <path d="M 450 420 Q 455 400 450 380 Q 445 360 450 340" stroke="white" stroke-width="4" fill="none" opacity="0.8"/>
  <path d="M 700 420 Q 705 400 700 380 Q 695 360 700 340" stroke="white" stroke-width="4" fill="none" opacity="0.8"/>
  <path d="M 950 420 Q 955 400 950 380 Q 945 360 950 340" stroke="white" stroke-width="4" fill="none" opacity="0.8"/>
