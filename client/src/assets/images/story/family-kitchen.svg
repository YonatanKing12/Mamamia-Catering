<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="kitchenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F5DC;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#DEB887;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D2B48C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="counterBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A0522D;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#kitchenBg)"/>
  
  <!-- Kitchen Counter -->
  <rect x="50" y="400" width="700" height="150" fill="url(#counterBg)" rx="10"/>
  
  <!-- Cabinets -->
  <rect x="100" y="300" width="150" height="100" fill="#654321" rx="5"/>
  <rect x="300" y="300" width="150" height="100" fill="#654321" rx="5"/>
  <rect x="500" y="300" width="150" height="100" fill="#654321" rx="5"/>
  
  <!-- Cabinet handles -->
  <circle cx="175" cy="350" r="3" fill="#D4AF37"/>
  <circle cx="375" cy="350" r="3" fill="#D4AF37"/>
  <circle cx="575" cy="350" r="3" fill="#D4AF37"/>
  
  <!-- Stove -->
  <rect x="250" y="420" width="120" height="80" fill="#2C3E50" rx="5"/>
  <circle cx="290" cy="450" r="15" fill="#34495E"/>
  <circle cx="330" cy="450" r="15" fill="#34495E"/>
  
  <!-- Pot on stove -->
  <ellipse cx="310" cy="460" rx="25" ry="15" fill="#708090"/>
  <path d="M 285 460 Q 310 445 335 460" stroke="#E6E6FA" stroke-width="3" fill="none" opacity="0.8"/>
  
  <!-- Kitchen utensils -->
  <rect x="450" y="430" width="4" height="40" fill="#8B4513"/>
  <circle cx="452" cy="425" r="8" fill="#FFE4B5"/>
  
  <rect x="480" y="435" width="3" height="35" fill="#8B4513"/>
  <ellipse cx="481.5" cy="430" rx="6" ry="4" fill="#C0C0C0"/>
  
  <!-- Cutting board -->
  <ellipse cx="550" cy="440" rx="40" ry="20" fill="#DEB887"/>
  
  <!-- Vegetables on cutting board -->
  <circle cx="530" cy="435" r="5" fill="#FF6347"/>
  <circle cx="545" cy="440" r="4" fill="#32CD32"/>
  <circle cx="560" cy="437" r="4" fill="#FF8C00"/>
  
  <!-- Window -->
  <rect x="600" y="100" width="120" height="100" fill="#87CEEB" stroke="#8B4513" stroke-width="4"/>
  <line x1="660" y1="100" x2="660" y2="200" stroke="#8B4513" stroke-width="2"/>
  <line x1="600" y1="150" x2="720" y2="150" stroke="#8B4513" stroke-width="2"/>
  
  <!-- Window view -->
  <circle cx="640" cy="130" r="15" fill="#FFD700" opacity="0.7"/>
  <path d="M 620 170 Q 640 160 660 170 Q 680 175 700 170" stroke="#32CD32" stroke-width="3" fill="none"/>
  
  <!-- Hanging herbs -->
  <rect x="150" y="80" width="3" height="30" fill="#8B4513"/>
  <ellipse cx="151.5" cy="75" rx="8" ry="12" fill="#228B22"/>
  
  <rect x="180" y="85" width="3" height="25" fill="#8B4513"/>
  <ellipse cx="181.5" cy="80" rx="6" ry="10" fill="#9ACD32"/>
  
  <!-- Pendant light -->
  <rect x="395" y="150" width="10" height="30" fill="#2C3E50"/>
  <ellipse cx="400" cy="180" rx="25" ry="15" fill="#F5DEB3" stroke="#D4AF37" stroke-width="2"/>
  
  <!-- Family warmth elements -->
  <text x="400" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#8B4513">
    מטבח משפחתי חם
  </text>
  <text x="400" y="80" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#A0522D">
    25 שנות אהבה ומסורת
  </text>
  
  <!-- Decorative heart -->
  <path d="M 100 550 C 95 545, 85 545, 80 550 C 85 545, 85 535, 90 540 C 95 535, 105 535, 110 540 C 105 545, 105 555, 100 550 Z" fill="#DC143C"/>
</svg>