<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="recipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#D2691E;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#recipeBg)"/>
  
  <!-- Cooking pot -->
  <ellipse cx="300" cy="180" rx="80" ry="40" fill="#2c3e50"/>
  <ellipse cx="300" cy="170" rx="75" ry="35" fill="#34495e"/>
  
  <!-- Steam -->
  <path d="M 250 150 Q 255 140 250 130 Q 245 120 250 110" stroke="white" stroke-width="3" fill="none" opacity="0.7"/>
  <path d="M 300 150 Q 305 140 300 130 Q 295 120 300 110" stroke="white" stroke-width="3" fill="none" opacity="0.7"/>
  <path d="M 350 150 Q 355 140 350 130 Q 345 120 350 110" stroke="white" stroke-width="3" fill="none" opacity="0.7"/>
  
  <!-- Handles -->
  <ellipse cx="220" cy="170" rx="15" ry="8" fill="#2c3e50"/>
  <ellipse cx="380" cy="170" rx="15" ry="8" fill="#2c3e50"/>
  
  <!-- Ingredients around -->
  <circle cx="150" cy="120" r="12" fill="#ff6b6b"/>
  <circle cx="450" cy="130" r="10" fill="#4ecdc4"/>
  <rect x="140" y="220" width="20" height="30" fill="#ffe66d" rx="3"/>
  <rect x="430" y="210" width="25" height="20" fill="#a8e6cf" rx="3"/>
  
  <text x="300" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
    המתכון הסודי לאסאדו
  </text>
  <text x="300" y="270" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white" opacity="0.9">
    הכנה ביתית עם טעם אמיתי
  </text>
</svg>