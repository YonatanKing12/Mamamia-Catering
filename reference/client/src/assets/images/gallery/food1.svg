<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="food" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#8B4513;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#food)"/>
  
  <!-- Plate -->
  <ellipse cx="300" cy="220" rx="120" ry="80" fill="#f8f8f8" stroke="#ddd" stroke-width="3"/>
  
  <!-- Food items -->
  <ellipse cx="250" cy="200" rx="30" ry="20" fill="#8B4513"/>
  <ellipse cx="350" cy="200" rx="25" ry="18" fill="#D2691E"/>
  <ellipse cx="300" cy="240" rx="20" ry="15" fill="#228B22"/>
  <ellipse cx="270" cy="235" rx="15" ry="12" fill="#FF6347"/>
  <ellipse cx="330" cy="235" rx="18" ry="14" fill="#FFD700"/>
  
  <!-- Garnish -->
  <path d="M 280 190 Q 290 185 300 190 Q 310 185 320 190" stroke="#228B22" stroke-width="2" fill="none"/>
  
  <text x="300" y="60" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#8B4513">
    המנות המיוחדות שלנו
  </text>
  <text x="300" y="350" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">
