<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Accessibility</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(45deg, #8B4513, #D4AF37);
            font-family: Arial, sans-serif;
            position: relative;
        }
        
        .test-button {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 64px;
            height: 64px;
            background: #2563eb;
            color: white;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 99999;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: all 0.3s ease;
        }
        
        .test-button:hover {
            transform: scale(1.1);
            background: #1d4ed8;
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 99997;
            display: none;
        }
        
        .overlay.show {
            display: block;
        }
        
        .sidebar {
            position: fixed;
            top: 0;
            right: 0;
            height: 100vh;
            width: 320px;
            background: linear-gradient(to bottom, white, #f8f6f0);
            box-shadow: -10px 0 25px rgba(0,0,0,0.3);
            z-index: 99998;
            transform: translateX(100%);
            transition: transform 0.3s ease-out;
        }
        
        .sidebar.show {
            transform: translateX(0);
        }
        
        .content {
            padding: 50px;
            color: white;
            text-align: center;
        }
        
        .sidebar-content {
            padding: 20px;
            height: 100%;
            overflow-y: auto;
        }
        
        .sidebar-header {
            display: flex;
            justify-content: between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #ddd;
            margin-bottom: 20px;
        }
        
        .close-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #f0f0f0;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: auto;
        }
        
        .control-group {
            margin-bottom: 20px;
        }
        
        .control-title {
            font-weight: bold;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid #ddd;
        }
        
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .control-btn {
            padding: 12px;
            border: 1px solid #D4AF37;
            background: #f8f6f0;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        
        .control-btn:hover {
            background: #D4AF37;
            color: white;
        }
        
        .toggle-btn {
            width: 100%;
            padding: 16px;
            border: 1px solid #D4AF37;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }
        
        .toggle-btn.active {
            background: #D4AF37;
            color: white;
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>בדיקת תפריט נגישות</h1>
        <p>לחץ על הכפתור הכחול לפתיחת התפריט</p>
    </div>
    
    <button class="test-button" onclick="toggleSidebar()" title="נגישות">
        ♿
    </button>
    
    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>
    
    <div class="sidebar" id="sidebar">
        <div class="sidebar-content">
            <div class="sidebar-header">
                <h3>תפריט נגישות</h3>
                <button class="close-btn" onclick="closeSidebar()">×</button>
            </div>
            
            <div class="control-group">
                <div class="control-title">גודל טקסט</div>
                <div class="btn-group">
                    <button class="control-btn" onclick="changeFontSize(+10)">+ הגדל טקסט</button>
                    <button class="control-btn" onclick="changeFontSize(-10)">- הקטן טקסט</button>
                </div>
                <div style="text-align: center; font-size: 12px; color: #666;">
                    גודל נוכחי: <span id="fontSize">100</span>%
                </div>
            </div>
            
            <div class="control-group">
                <div class="control-title">הגדרות תצוגה</div>
                <button class="toggle-btn" id="contrastBtn" onclick="toggleContrast()">
                    <span>ניגודיות גבוהה</span>
                    <span>○</span>
                </button>
                <button class="toggle-btn" id="invertBtn" onclick="toggleInvert()">
                    <span>הפיכת צבעים</span>
                    <span>○</span>
                </button>
                <button class="toggle-btn" id="underlineBtn" onclick="toggleUnderline()">
                    <span>קו תחתון לקישורים</span>
                    <span>○</span>
                </button>
            </div>
            
            <div class="control-group">
                <button class="control-btn" style="width: 100%; background: #dc2626; color: white; border-color: #dc2626;" onclick="resetAll()">
                    איפוס כל ההגדרות
                </button>
            </div>
        </div>
    </div>
    
    <script>
        let isOpen = false;
        let fontSize = 100;
        let highContrast = false;
        let invertColors = false;
        let underlineLinks = false;
        
        function toggleSidebar() {
            console.log('Toggling sidebar, current state:', isOpen);
            isOpen = !isOpen;
            
            const overlay = document.getElementById('overlay');
            const sidebar = document.getElementById('sidebar');
            
            if (isOpen) {
                overlay.classList.add('show');
                sidebar.classList.add('show');
                console.log('Sidebar opened');
            } else {
                overlay.classList.remove('show');
                sidebar.classList.remove('show');
                console.log('Sidebar closed');
            }
        }
        
        function closeSidebar() {
            console.log('Closing sidebar');
            isOpen = false;
            document.getElementById('overlay').classList.remove('show');
            document.getElementById('sidebar').classList.remove('show');
        }
        
        function changeFontSize(delta) {
            fontSize = Math.min(Math.max(fontSize + delta, 80), 200);
            document.documentElement.style.fontSize = fontSize + '%';
            document.getElementById('fontSize').textContent = fontSize;
            console.log('Font size changed to:', fontSize);
        }
        
        function toggleContrast() {
            highContrast = !highContrast;
            const btn = document.getElementById('contrastBtn');
            
            if (highContrast) {
                document.documentElement.style.setProperty('--bg-color', '#000');
                document.documentElement.style.setProperty('--text-color', '#fff');
                document.body.style.background = 'black';
                document.body.style.color = 'white';
                btn.classList.add('active');
                btn.querySelector('span:last-child').textContent = '●';
            } else {
                document.documentElement.style.removeProperty('--bg-color');
                document.documentElement.style.removeProperty('--text-color');
                document.body.style.background = '';
                document.body.style.color = '';
                btn.classList.remove('active');
                btn.querySelector('span:last-child').textContent = '○';
            }
            console.log('High contrast:', highContrast);
        }
        
        function toggleInvert() {
            invertColors = !invertColors;
            const btn = document.getElementById('invertBtn');
            
            if (invertColors) {
                document.documentElement.style.filter = 'invert(1) hue-rotate(180deg)';
                btn.classList.add('active');
                btn.querySelector('span:last-child').textContent = '●';
            } else {
                document.documentElement.style.filter = '';
                btn.classList.remove('active');
                btn.querySelector('span:last-child').textContent = '○';
            }
            console.log('Invert colors:', invertColors);
        }
        
        function toggleUnderline() {
            underlineLinks = !underlineLinks;
            const btn = document.getElementById('underlineBtn');
            
            if (underlineLinks) {
                const style = document.createElement('style');
                style.id = 'underline-style';
                style.textContent = 'a, button { text-decoration: underline !important; }';
                document.head.appendChild(style);
                btn.classList.add('active');
                btn.querySelector('span:last-child').textContent = '●';
            } else {
                const existing = document.getElementById('underline-style');
                if (existing) existing.remove();
                btn.classList.remove('active');
                btn.querySelector('span:last-child').textContent = '○';
            }
            console.log('Underline links:', underlineLinks);
        }
        
        function resetAll() {
            console.log('Resetting all accessibility settings');
            fontSize = 100;
            highContrast = false;
            invertColors = false;
            underlineLinks = false;
            
            document.documentElement.style.fontSize = '100%';
            document.documentElement.style.filter = '';
            document.documentElement.style.removeProperty('--bg-color');
            document.documentElement.style.removeProperty('--text-color');
            document.body.style.background = '';
            document.body.style.color = '';
            
            const existing = document.getElementById('underline-style');
            if (existing) existing.remove();
            
            document.getElementById('fontSize').textContent = '100';
            document.getElementById('contrastBtn').classList.remove('active');
            document.getElementById('invertBtn').classList.remove('active');
            document.getElementById('underlineBtn').classList.remove('active');
            
            document.getElementById('contrastBtn').querySelector('span:last-child').textContent = '○';
            document.getElementById('invertBtn').querySelector('span:last-child').textContent = '○';
            document.getElementById('underlineBtn').querySelector('span:last-child').textContent = '○';
        }
    </script>
</body>
</html>
