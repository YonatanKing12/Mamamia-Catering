<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Simple Button</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(45deg, #8B4513, #D4AF37);
            font-family: Arial, sans-serif;
            position: relative;
        }
        
        .test-button {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 64px;
            height: 64px;
            background: #2563eb;
            color: white;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 99999;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: all 0.3s ease;
        }
        
        .test-button:hover {
            transform: scale(1.1);
            background: #1d4ed8;
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 99998;
            display: none;
        }
        
        .overlay.show {
            display: block;
        }
        
        .popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 10px;
            z-index: 99999;
            display: none;
        }
        
        .popup.show {
            display: block;
        }
        
        .content {
            padding: 50px;
            color: white;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>בדיקת כפתור פשוט</h1>
        <p>לחץ על הכפתור הכחול בפינה</p>
    </div>
    
    <button class="test-button" onclick="togglePopup()" title="בדיקה">
        ♿
    </button>
    
    <div class="overlay" id="overlay" onclick="closePopup()"></div>
    <div class="popup" id="popup">
        <h3>כפתור הנגישות עובד!</h3>
        <p>זה הוכיח שהכפתור נלחץ</p>
        <button onclick="closePopup()">סגור</button>
    </div>
    
    <script>
        function togglePopup() {
            console.log('Button clicked!');
            const overlay = document.getElementById('overlay');
            const popup = document.getElementById('popup');
            overlay.classList.add('show');
            popup.classList.add('show');
        }
        
        function closePopup() {
            console.log('Closing popup');
            const overlay = document.getElementById('overlay');
            const popup = document.getElementById('popup');
            overlay.classList.remove('show');
            popup.classList.remove('show');
        }
    </script>
</body>
</html>
